# sonar-project.properties — โครงสร้างโปรเจกต์ให้ SonarQube
# ไม่ใส่ host / token / project key ที่นี่: Deploy Console ส่งมาจากตัวแปร SONAR_HOST_URL, SONAR_TOKEN, SONAR_PROJECT_KEY
# ไม่ตั้ง exclude เพื่อดัน coverage — แค่บอกว่าไฟล์ไหนเป็นโค้ดและไฟล์ไหนเป็นเทสต์
sonar.sources=backend/src,frontend/src
sonar.tests=backend/test
sonar.test.inclusions=backend/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
